name: Automated Timetable Update Pipeline

on:
  schedule:
    # Run every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Force rebuild and publish even if version is unchanged"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: timetable-update-pipeline
  cancel-in-progress: true

jobs:
  check-and-update:
    name: Check & Update Timetable
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Timetable Update Pipeline
        id: pipeline
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python pipeline/update_pipeline.py $FORCE_FLAG

      - name: Commit & Push New Timetable
        if: steps.pipeline.outputs.has_updates == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add timetable/mumbai-watch.db timetable/metadata.json
          git commit -m "chore(timetable): Auto-update timetable database to version ${{ steps.pipeline.outputs.version }}"
          git push origin main
